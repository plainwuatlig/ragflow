# This fork only: builds and tests the Rust runtime under rust/. Never touches
# upstream's pipelines.
name: rust-runtime
on:
  push:
    branches-ignore: [main]
    paths: ["rust/**", ".github/workflows/rust-runtime.yml"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust-runtime.yml"]
jobs:
  test:
    if: github.repository != 'infiniflow/ragflow'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  conformance-canvas:
    # The canvas part of the conformance suite: the Rust runtime against the
    # goldens recorded from upstream's Go runtime when contract v1 was cut
    # (rust/conformance/README.md). No Go: the goldens are checked in.
    if: github.repository != 'infiniflow/ragflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rust/conformance/run.sh canvas
