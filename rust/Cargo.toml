[workspace]
resolver = "2"
members = [
    "crates/ragflow-runtime",
    "crates/ragflow-parity",
    "crates/ragflow-analyzer",
    "crates/ragflow-retrieval",
    "crates/ragflow-server",
]
# ragflow-analyzer (and ragflow-retrieval through it) links a C++ archive built
# in Docker (docker/*.Dockerfile); keep them out of a bare `cargo test` /
# `cargo clippy` on machines without it.
default-members = ["crates/ragflow-runtime", "crates/ragflow-parity", "crates/ragflow-server"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
# CodeExec runs `lang: lua` scripts in-process on Luau (sandboxed; no io, os or network).
mlua = { version = "0.11.6", features = ["luau"] }
