[package]
name = "ragflow-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "RAGFlow's agent endpoints served from RAGFlow's own MySQL and Kvrocks stores"

[features]
# Wires ragflow-retrieval (Elasticsearch retrieval over the C++ analyzer) into
# the server binary. Off by default so a bare `cargo test` needs no C++ archive.
retrieval = ["dep:ragflow-retrieval"]

[dependencies]
ragflow-runtime = { path = "../ragflow-runtime" }
ragflow-retrieval = { path = "../ragflow-retrieval", features = ["live"], optional = true }
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
chrono = { workspace = true, features = ["clock"] }
thiserror.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-stream = "0.1"
mysql = { version = "25", default-features = false, features = ["minimal"] }
redis = { version = "0.27", default-features = false }
ureq = { version = "2", default-features = false, features = ["json"] }
sha1 = "0.10"
hmac = "0.12"
base64 = "0.22"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
chrono.workspace = true

[[bin]]
name = "ragflow-server"
path = "src/main.rs"
required-features = ["retrieval"]
